{% extends "base.html" %}
{% block title %}Page Not Found{% endblock %}
{% block content %}
<div class="card" style="text-align: center; padding: 3rem 1.5rem;">
    <h1 style="font-size: 3rem; margin: 0; color: var(--danger);">404</h1>
    <h2 style="margin: 0.5rem 0 1rem 0;">Page Not Found</h2>
    <p style="color: var(--text-muted); max-width: 500px; margin: 0 auto 1.5rem auto;">
        The requested resource or page could not be located in the SmartFlow system.
    </p>
    <div>
        <a href="{{ url_for('main.dashboard') }}" class="btn btn-primary">Return to Dashboard</a>
    </div>
</div>
{% endblock %}
